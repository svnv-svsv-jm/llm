repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run just black
        language: system
        files: \.py$
        types: [python]

      - id: mypy
        name: mypy
        entry: uv run just mypy
        language: system
        files: \.py$
        types: [python]

      - id: pylint
        name: pylint
        entry: uv run just pylint
        language: system
        files: \.py$
        types: [python]