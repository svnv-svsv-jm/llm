repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run just black-fix
        language: system
        files: \.py$
        types: [python]
        pass_filenames: false

      - id: black
        name: black
        entry: uv run just black-check
        language: system
        files: \.py$
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run just mypy
        language: system
        files: \.py$
        types: [python]
        pass_filenames: false

      - id: pylint
        name: pylint
        entry: uv run just pylint
        language: system
        files: \.py$
        types: [python]
        pass_filenames: false

      - id: unit-test
        name: unit-test
        entry: uv run just unit-test
        language: system
        files: \.py$
        types: [python]
        pass_filenames: false

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.7.2
    hooks:
      - id: uv-lock
        name: Update uv lockfile

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=600']
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
        args: [ --unsafe ]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.14.0
    hooks:
      - id: pretty-format-toml
        args: [--autofix, --no-sort]

  - repo: https://github.com/kynan/nbstripout
    rev: 0.5.0
    hooks:
      - id: nbstripout
