repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run just black
        language: system
        files: \.py$
        types: [python]

      - id: mypy
        name: mypy
        entry: uv run just mypy
        language: system
        files: \.py$
        types: [python]

      - id: pylint
        name: pylint
        entry: uv run just pylint
        language: system
        files: \.py$
        types: [python]
      
      - id: unit-test
        name: unit-test
        entry: uv run just unit-test
        language: system
        files: \.py$
        types: [python]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.7.2
    hooks:
      - id: uv-lock
        name: Update uv lockfile
        args: ["--locked", "--all-packages"]
